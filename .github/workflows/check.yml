name: SKYLRK new item check v2

on:
  workflow_dispatch:         # 讓 cron-job.org（或你自己）可以按按鈕觸發

permissions:
  contents: write            # 允許程式把 seen.json 存回來

concurrency:
  group: skylrk-check        # 同一時間只跑一個，後面來的排隊等前面跑完
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save seen.json back to repo
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git pull --rebase
          git push
