name: SKYLRK new item check v2

on:
  schedule:
    - cron: "*/12 * * * *"   # 每 12 分鐘跑一次 (UTC 時間，但對你沒差)
  workflow_dispatch:         # 讓你可以手動按按鈕立刻跑一次

permissions:
  contents: write            # 允許程式把 seen.json 存回來

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save seen.json back to repo
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git push
